configuration:
  password:
    name: Senha do acesso direto
    description: Senha para abrir o painel em http://<ip-do-ha>:8050 (só vale com o acesso direto ligado).
  viewer_password:
    name: Senha somente leitura
    description: Senha do perfil que só consulta, no acesso direto.
  direct_access:
    name: Acesso direto pela porta 8050
    description: Desligado, o painel só abre pela barra lateral do Home Assistant.
  cloud_region:
    name: Servidor da nuvem Xiaomi
    description: >-
      Servidor em que o robô está na conta Xiaomi (só para o mapa e o cadastro). auto = descobre sozinho.
      us = EUA (contas do Brasil), de = Europa, sg = Singapura, cn = China, ru = Rússia, i2 = Índia.
  admins:
    name: Administradores do painel
    description: >-
      Login (nome de usuário) de quem entra como administrador no painel, além dos administradores do Home Assistant.
      O Registro do app mostra o usuário de quem abriu o painel.
  others:
    name: Perfil dos demais usuários
    description: >-
      operator = comanda o robô (limpeza, cômodos, base, modos) sem mexer em configurações; viewer = só consulta.
  mqtt:
    name: Integração MQTT
    description: >-
      Cria o robô como dispositivo no Home Assistant (aspirador, bateria, consumíveis, botões da base) pelo app
      Mosquitto broker. Tudo local: os comandos passam pelo painel e vão ao robô pela rede local.
  mqtt_host:
    name: Endereço do broker MQTT
    description: >-
      Deixe em branco para usar o app Mosquitto broker do Home Assistant. Preencha só para um broker externo.
  mqtt_port:
    name: Porta do broker MQTT
    description: Padrão 1883 (a do app Mosquitto broker).
  mqtt_user:
    name: Usuário do MQTT
    description: >-
      Usuário do broker: um usuário do Home Assistant ou um login configurado no app Mosquitto. Em branco, o app tenta
      o usuário que o Supervisor fornece.
  mqtt_password:
    name: Senha do MQTT
  mqtt_discovery_prefix:
    name: Prefixo do MQTT discovery
    description: Só mude se alterou o prefixo na integração MQTT do Home Assistant (padrão homeassistant).
  log_level:
    name: Nível de log
