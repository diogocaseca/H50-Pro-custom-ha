configuration:
  password:
    name: Direct access password
    description: Password for http://<ha-ip>:8050 (only used when direct access is on).
  viewer_password:
    name: Read-only password
    description: Password for the read-only profile on direct access.
  direct_access:
    name: Direct access on port 8050
    description: When off, the panel only opens from the Home Assistant sidebar.
  cloud_region:
    name: Xiaomi cloud server
    description: >-
      Server where the robot is registered in the Xiaomi account (used only for the map and setup). auto = detect.
      us = USA, de = Europe, sg = Singapore, cn = China, ru = Russia, i2 = India.
  admins:
    name: Panel administrators
    description: >-
      Login (username) of users who get the administrator profile in the panel, besides Home Assistant administrators.
      The app log shows the username of whoever opened the panel.
  others:
    name: Profile of the other users
    description: >-
      operator = controls the robot (cleaning, rooms, dock, modes) without changing settings; viewer = read-only.
  mqtt:
    name: MQTT integration
    description: >-
      Adds the robot as a Home Assistant device (vacuum, battery, consumables, dock buttons) through the Mosquitto
      broker app. Fully local: commands go through the panel and reach the robot over the LAN.
  mqtt_discovery_prefix:
    name: MQTT discovery prefix
    description: Only change it if you changed the prefix in the Home Assistant MQTT integration (default homeassistant).
  log_level:
    name: Log level
